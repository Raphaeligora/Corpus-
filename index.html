<body>
<div id="coach-app-root"></div>
<style>
#coach-app-root{
  --bg:#0E0D0C; --surface:#19170F; --surface-2:#211E17; --surface-3:#2A261C;
  --border:#332E23; --border-soft:#252017;
  --text:#EDE6D6; --text-dim:#A79E8C; --text-muted:#665D4C;
  --gold:#C9A467; --gold-soft:#3D3323; --gold-bright:#E4C388;
  --pull:#8CA98E; --legs:#9C8F6E; --upper:#C08659;
  --success:#7FA87E; --danger:#B26A5E;
  font-family:'Inter',-apple-system,sans-serif;
  background:var(--bg); color:var(--text);
  max-width:480px; margin:0 auto; min-height:100vh;
  display:flex; flex-direction:column; position:relative;
}
#coach-app-root *{box-sizing:border-box;}
#coach-app-root .serif{font-family:'Cormorant Garamond',serif;}
#coach-app-root .mono{font-family:'IBM Plex Mono',monospace;}
#coach-app-root .scroll-area{flex:1; overflow-y:auto; padding:18px 18px 92px; -webkit-overflow-scrolling:touch;}
#coach-app-root .top-header{padding:22px 18px 14px; border-bottom:0.5px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:5; display:flex; justify-content:space-between; align-items:baseline;}
#coach-app-root .top-header .date{font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.14em;}
#coach-app-root .top-header .title{font-size:26px; font-weight:600; letter-spacing:0.01em;}
#coach-app-root .top-header .mark{width:7px; height:7px; border-radius:50%; background:var(--gold); display:inline-block; margin-left:6px; vertical-align:middle;}
#coach-app-root .tabbar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; display:flex; background:rgba(25,23,15,0.94); backdrop-filter:blur(6px); border-top:0.5px solid var(--border); z-index:10;}
#coach-app-root .tabbar button{flex:1; background:none; border:none; color:var(--text-muted); padding:13px 0 11px; font-size:10.5px; letter-spacing:0.03em; font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer;}
#coach-app-root .tabbar button.active{color:var(--gold);}
#coach-app-root .tabbar svg{width:19px; height:19px;}
#coach-app-root .card{background:var(--surface); border:0.5px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px;}
#coach-app-root .badge{display:inline-block; padding:4px 12px; border-radius:20px; font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; font-weight:600; border:0.5px solid;}
#coach-app-root .badge.push{background:var(--gold-soft); color:var(--gold-bright); border-color:var(--gold);}
#coach-app-root .badge.pull{background:#1A2420; color:var(--pull); border-color:var(--pull);}
#coach-app-root .badge.legs{background:#221F16; color:var(--legs); border-color:var(--legs);}
#coach-app-root .badge.upper{background:#251A12; color:var(--upper); border-color:var(--upper);}
#coach-app-root .badge.rest{background:var(--surface-2); color:var(--text-muted); border-color:var(--border);}
#coach-app-root .ring-wrap{display:flex; flex-direction:column; align-items:center; padding:8px 0 4px;}
#coach-app-root .ring-wrap svg{width:132px; height:132px;}
#coach-app-root .ring-num{font-size:34px; font-weight:600;}
#coach-app-root .ring-cap{font-size:11px; color:var(--text-muted); letter-spacing:0.06em; text-transform:uppercase; margin-top:2px;}
#coach-app-root .ex-card{background:var(--surface); border:0.5px solid var(--border); border-radius:16px; margin-bottom:10px; overflow:hidden;}
#coach-app-root .ex-head{padding:15px 16px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
#coach-app-root .ex-head .name{font-size:15px; font-weight:500;}
#coach-app-root .ex-head .meta{font-size:11.5px; color:var(--text-muted); margin-top:3px; letter-spacing:0.02em;}
#coach-app-root .ex-body{padding:0 16px 16px; display:none; border-top:0.5px solid var(--border-soft);}
#coach-app-root .ex-body.open{display:block;}
#coach-app-root .diagram{display:flex; align-items:center; gap:12px; padding:14px 2px 8px;}
#coach-app-root .diagram .pose{flex:0 0 56px; height:56px; opacity:0.85;}
#coach-app-root .diagram .pose svg{width:100%; height:100%;}
#coach-app-root .diagram .motion{flex:1; position:relative; height:56px; display:flex; align-items:center;}
#coach-app-root .diagram .track-v{width:3px; height:40px; background:var(--border); border-radius:2px; margin:0 auto; position:relative;}
#coach-app-root .diagram .track-h{height:3px; width:100%; background:var(--border); border-radius:2px; position:relative; margin-top:9px;}
#coach-app-root .diagram .marker{width:12px; height:12px; border-radius:3px; background:var(--gold); position:absolute; left:50%; transform:translateX(-50%);}
#coach-app-root .diagram.vertical .marker{animation:markV 2.6s ease-in-out infinite;}
#coach-app-root .diagram.horizontal .marker{top:-4.5px; left:0; animation:markH 2.6s ease-in-out infinite;}
#coach-app-root .diagram .lbl{position:absolute; font-size:9px; color:var(--text-muted); white-space:nowrap; letter-spacing:0.02em;}
#coach-app-root .diagram .lbl.top{top:-6px; left:50%; transform:translateX(-50%);}

const DAY_MAP = {1:'rest',2:'push',3:'pull',4:'rest',5:'legs',6:'upper',0:'rest'};

const POSE_SVG = {

};

async function storeGet(key){
  try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function storeSet(key, val){
  try{ await window.storage.set(key, JSON.stringify(val), false); }catch(e){ console.error('storage error', e); }
}
function todayKey(d){ d = d || new Date(); return d.toISOString().slice(0,10); }
function fmtDate(d){ return d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'}); }

let state = { tab:'today', logs:{}, photos:[], sessionDraft:{}, expanded:{}, calMonth:null };

async function init(){
  state.logs = (await storeGet('workout-logs')) || {};
  state.photos = (await storeGet('progress-photos')) || [];
  const today = todayKey();
  const existing = state.logs[today];
  state.sessionDraft = existing ? JSON.parse(JSON.stringify(existing)) : {dayType: DAY_MAP[new Date().getDay()], entries:{}, notes:'', completed:false};
  render();
}

function lastWeightsFor(exId){
  const dates = Object.keys(state.logs).filter(d=>d!==todayKey()).sort().reverse();
  for(const d of dates){
    const entry = state.logs[d].entries && state.logs[d].entries[exId];
    if(entry){
      const weights = entry.sets.map(s=>s.weight).filter(w=>w!=='' && w!=null);
      if(weights.length) return entry.sets.map(s=>s.weight);
    }
  }
  return null;
}

function ensureEntry(exId, exDef){
  if(!state.sessionDraft.entries[exId]){
    const prev = lastWeightsFor(exId);
    state.sessionDraft.entries[exId] = {sets: Array.from({length: exDef.sets}, (_,i)=>({weight: prev && prev[i] ? prev[i] : '', reps:'', done:false}))};
  }
  return state.sessionDraft.entries[exId];
}

function diagramHTML(ex){
  const d = ex.diagram;
  const pose = POSE_MAP[ex.id] || 'standing';
  const poseHTML = '<div class="pose">' + POSE_SVG[pose] + '</div>';
  if(d.hold){
    return '<div class="diagram hold">' + poseHTML + '<span>' + d.hold + '</span></div>';
  }
  if(d.axis === 'vertical'){
    return '<div class="diagram vertical">' + poseHTML +
      '<div class="motion"><div class="track-v"><div class="marker"></div>' +
      '<span class="lbl top">' + d.top + '</span>' +
      '<span class="lbl bottom">' + d.bottom + '</span>' +
      '</div></div></div>';
  }
  return '<div class="diagram horizontal">' + poseHTML +
    '<div class="motion" style="flex-direction:column; align-items:stretch;">' +
    '<div class="track-h"><div class="marker"></div></div>' +
    '<div style="display:flex; justify-content:space-between; margin-top:7px;">' +
    '<span class="lbl" style="position:static;">' + d.left + '</span>' +
    '<span class="lbl" style="position:static; text-align:right;">' + d.right + '</span>' +
    '</div></div></div>';
}

function ringHTML(doneSets, totalSets){
  const pct = totalSets ? Math.round((doneSets/totalSets)*100) : 0;
  const r = 54, c = 2*Math.PI*r;
  const offset = c - (pct/100)*c;
  return '<div class="ring-wrap"><svg viewBox="0 0 132 132">' +
    '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="var(--border)" stroke-width="7"/>' +
    '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="var(--gold)" stroke-width="7" stroke-linecap="round" ' +
    'stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '" transform="rotate(-90 66 66)"/>' +
    '<text x="66" y="72" text-anchor="middle" font-size="30" font-weight="600" fill="var(--text)" font-family="Cormorant Garamond, serif">' + pct + '%</text>' +
    '</svg><div class="ring-cap">' + doneSets + ' / ' + totalSets + ' séries</div></div>';
}

function renderToday(){
  const dayType = state.sessionDraft.dayType;
  let html = '<div class="reminder">Séance du jour : ' + (dayType==='rest' ? 'repos' : PROGRAM[dayType].label + ' — ' + PROGRAM[dayType].focus) + '</div>';

  if(dayType === 'rest'){
    html += '<div class="card" style="text-align:center; padding:36px 14px;"><div class="serif" style="font-size:28px; font-weight:600;">Jour de repos</div><div style="color:var(--text-dim); font-size:13px; margin-top:8px;">Récupération = progression. Bonne détente aujourd\'hui.</div></div>';
    root.querySelector('.scroll-area').innerHTML = html;
    return;
  }

  const prog = PROGRAM[dayType];
  const totalSets = prog.exercises.reduce((a,e)=>a+e.sets,0);
  let doneSets = 0;
  prog.exercises.forEach(ex=>{
    const entry = ensureEntry(ex.id, ex);
    doneSets += entry.sets.filter(s=>s.done).length;
  });

  html += '<div class="card">' +
    '<span class="badge ' + prog.badgeClass + '">' + prog.label + '</span>' +
    ringHTML(doneSets, totalSets) +
    '</div>';

  prog.exercises.forEach(ex=>{
    const entry = ensureEntry(ex.id, ex);
    const isOpen = state.expanded[ex.id];
    const doneCount = entry.sets.filter(s=>s.done).length;
    const suggestedLine = lastWeightsFor(ex.id) ? 'Poids pré-remplis d\'après ta dernière séance — ajuste si besoin.' : 'Poids de départ suggéré : ' + ex.suggested;
    html += '<div class="ex-card">' +
      '<div class="ex-head" data-toggle="' + ex.id + '">' +
      '<div><div class="name">' + ex.name + '</div><div class="meta">' + ex.sets + ' x ' + ex.reps + ' · repos ' + ex.rest + 's' + (doneCount>0?' · ' + doneCount + '/' + ex.sets + ' faites':'') + '</div></div>' +
      '<div style="color:var(--text-muted); font-size:17px;">' + (isOpen?'&#8722;':'&#43;') + '</div>' +
      '</div>' +
      '<div class="ex-body ' + (isOpen?'open':'') + '">' +
      diagramHTML(ex) +
      '<div class="cues">' + ex.cues + '</div>' +
      '<div class="suggested">' + suggestedLine + '</div>' +
      '<table class="sets-table"><tr><th>Série</th><th>Poids (kg)</th><th>Reps</th><th></th></tr>' +
      entry.sets.map((s,i)=>'<tr>' +
        '<td class="mono">' + (i+1) + '</td>' +
        '<td><input type="number" step="0.5" data-ex="' + ex.id + '" data-set="' + i + '" data-field="weight" value="' + s.weight + '" placeholder="0"/></td>' +
        '<td><input type="number" data-ex="' + ex.id + '" data-set="' + i + '" data-field="reps" value="' + s.reps + '" placeholder="0"/></td>' +
        '<td><button class="check-btn ' + (s.done?'done':'') + '" data-check="' + ex.id + ':' + i + '" data-rest="' + ex.rest + '">' + (s.done?'&#10003;':'') + '</button></td>' +
        '</tr>').join('') +
      '</table>' +
      '<div id="timer-' + ex.id + '"></div>' +
      '</div></div>';
  });

  html += '<textarea id="session-notes" placeholder="Notes sur la séance (ressenti, fatigue...)">' + (state.sessionDraft.notes||'') + '</textarea>';
  html += '<button class="finish-btn" id="finish-session">Terminer la séance</button>';
  root.querySelector('.scroll-area').innerHTML = html;
  bindTodayEvents();
}

function playBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0,1,2].forEach(i=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, ctx.currentTime + i*0.25);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.25 + 0.2);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i*0.25); osc.stop(ctx.currentTime + i*0.25 + 0.2);
    });
  }catch(e){}
}

let timerInterval = null;
function startRestTimer(exId, seconds){
  clearInterval(timerInterval);
  let remaining = seconds;
  const container = root.querySelector('#timer-' + exId);
  function draw(){
    const m = Math.floor(remaining/60), s = remaining%60;
    container.innerHTML = '<div class="timer-box"><div class="t mono">' + m + ':' + s.toString().padStart(2,'0') + '</div><button id="stop-timer">Stop</button></div>';
    const btn = container.querySelector('#stop-timer');
    if(btn) btn.onclick = function(){ clearInterval(timerInterval); container.innerHTML=''; };
  }
  draw();
  timerInterval = setInterval(function(){
    remaining--;
    if(remaining < 0){ clearInterval(timerInterval); container.innerHTML=''; playBeep(); return; }
    draw();
  }, 1000);
}

function bindTodayEvents(){
  root.querySelectorAll('[data-toggle]').forEach(function(el){
    el.onclick = function(){ const id = el.dataset.toggle; state.expanded[id] = !state.expanded[id]; renderToday(); };
  });
  root.querySelectorAll('.sets-table input').forEach(function(inp){
    inp.oninput = function(){
      const ex = inp.dataset.ex, set = inp.dataset.set, field = inp.dataset.field;
      state.sessionDraft.entries[ex].sets[set][field] = inp.value;
    };
  });
  root.querySelectorAll('[data-check]').forEach(function(btn){
    btn.onclick = function(){
      const parts = btn.dataset.check.split(':'); const exId = parts[0], idx = parts[1];
      const s = state.sessionDraft.entries[exId].sets[idx];
      s.done = !s.done;
      if(s.done) startRestTimer(exId, parseInt(btn.dataset.rest));
      renderToday();
    };
  });
  const notes = root.querySelector('#session-notes');
  if(notes) notes.oninput = function(){ state.sessionDraft.notes = notes.value; };
  const finishBtn = root.querySelector('#finish-session');
  if(finishBtn) finishBtn.onclick = async function(){
    state.sessionDraft.completed = true;
    state.sessionDraft.date = todayKey();
    state.logs[todayKey()] = state.sessionDraft;
    await storeSet('workout-logs', state.logs);
    finishBtn.textContent = 'Séance enregistrée';
    finishBtn.disabled = true;
  };
}

function allExercisesFlat(){
  let list = [];
  Object.values(PROGRAM).forEach(function(p){ p.exercises.forEach(function(e){ list.push(Object.assign({}, e, {day:p.label})); }); });
  return list;
}

function renderHistory(){
  const flat = allExercisesFlat();
  const area = root.querySelector('.scroll-area');
  const dates = Object.keys(state.logs).sort();
  if(dates.length === 0){
    area.innerHTML = '<div class="empty">Aucune séance enregistrée pour le moment.<br/>Termine ta première séance pour voir ta progression ici.</div>';
    return;
  }
  let selected = state.historySelected || flat[0].id;
  let options = flat.map(function(e){ return '<option value="' + e.id + '" ' + (e.id===selected?'selected':'') + '>' + e.name + ' (' + e.day + ')</option>'; }).join('');

  const points = [];
  dates.forEach(function(d){
    const log = state.logs[d];
    const entry = log.entries[selected];
    if(entry){
      const weights = entry.sets.map(function(s){ return parseFloat(s.weight); }).filter(function(w){ return !isNaN(w); });
      if(weights.length) points.push({date:d, weight:Math.max.apply(null, weights)});
    }
  });

  let progressPct = 0;
  if(points.length >= 2){
    progressPct = Math.round(((points[points.length-1].weight - points[0].weight)/points[0].weight)*100);
  }

  const maxW = Math.max.apply(null, points.map(function(p){ return p.weight; }).concat([1]));
  const barsHTML = points.map(function(p){
    const h = Math.max(6, Math.round((p.weight/maxW)*90));
    return '<div style="display:flex; flex-direction:column; align-items:center; gap:4px; flex:1;">' +
      '<div class="mono" style="font-size:10px; color:var(--text-dim);">' + p.weight + '</div>' +
      '<div style="width:70%; height:' + h + 'px; background:var(--gold); border-radius:4px 4px 0 0;"></div>' +
      '<div style="font-size:9px; color:var(--text-muted);">' + p.date.slice(5) + '</div>' +
      '</div>';
  }).join('');

  area.innerHTML =
    '<select id="hist-select">' + options + '</select>' +
    '<div class="stat-row">' +
    '<div class="stat"><div class="num mono" style="color:' + (progressPct>=0?'var(--success)':'var(--danger)') + '">' + (progressPct>0?'+':'') + progressPct + '%</div><div class="lbl">progression charge</div></div>' +
    '<div class="stat"><div class="num mono">' + points.length + '</div><div class="lbl">séances loguées</div></div>' +
    '</div>' +
    '<div class="chart-wrap">' +
    (points.length ? '<div style="display:flex; align-items:flex-end; gap:6px; height:110px;">' + barsHTML + '</div>' : '<div class="empty" style="padding:20px;">Pas encore de charge enregistrée pour cet exercice.</div>') +
    '</div>';
  root.querySelector('#hist-select').onchange = function(e){ state.historySelected = e.target.value; renderHistory(); };
}

function compressImage(file){
  return new Promise(function(resolve){
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const maxW = 480;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderPhotos(){
  const area = root.querySelector('.scroll-area');
  const sorted = state.photos.slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
  area.innerHTML = '<div class="photo-grid">' +
    '<div class="add-photo" id="add-photo-btn"><span style="font-size:20px;">+</span><span>Ajouter une photo</span></div>' +
    sorted.map(function(p,i){ return '<div class="photo-item" data-view="' + p.date + '-' + i + '"><img src="' + p.dataUrl + '"/><div class="pdate">' + p.date + '</div></div>'; }).join('') +
    '</div><input type="file" accept="image/*" id="photo-input" style="display:none;"/>';
  area.querySelector('#add-photo-btn').onclick = function(){ area.querySelector('#photo-input').click(); };
  area.querySelector('#photo-input').onchange = async function(e){
    const file = e.target.files[0];
    if(!file) return;
    const dataUrl = await compressImage(file);
    state.photos.push({date: todayKey(), dataUrl:dataUrl});
    await storeSet('progress-photos', state.photos);
    renderPhotos();
  };
  area.querySelectorAll('[data-view]').forEach(function(el){
    el.onclick = function(){
      const modal = document.createElement('div');
      modal.className = 'modal center';
      modal.innerHTML = '<button class="close">&times;</button><img src="' + el.querySelector('img').src + '"/>';
      modal.onclick = function(ev){ if(ev.target===modal || ev.target.className==='close') modal.remove(); };
      root.appendChild(modal);
    };
  });
}

function closeSheet(){
  const m = root.querySelector('.modal');
  if(m) m.remove();
}

function openDaySheet(dateStr){
  const dateObj = new Date(dateStr + 'T00:00:00');
  const dayType = DAY_MAP[dateObj.getDay()];
  const isToday = dateStr === todayKey();
  const log = state.logs[dateStr];
  const dayLabel = dateObj.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});

  let body;
  if(dayType === 'rest'){
    body = '<div class="sheet-title">Repos</div><div class="sheet-sub">' + dayLabel + '</div>' +
      '<div style="color:var(--text-dim); font-size:13px; padding:10px 0;">Aucune séance prévue ce jour.</div>';
  } else {
    const prog = PROGRAM[dayType];
    body = '<div class="sheet-title">' + prog.label + '</div>' +
      '<div class="sheet-sub">' + dayLabel + ' · ' + prog.focus + '</div>' +
      prog.exercises.map(function(ex){
        const done = log && log.entries[ex.id] ? log.entries[ex.id].sets.filter(function(s){return s.done;}).length : null;
        return '<div class="sheet-ex"><span class="n">' + ex.name + '</span><span class="m">' + ex.sets + ' x ' + ex.reps + (done!=null ? ' · ' + done + '/' + ex.sets + ' faites' : '') + '</span></div>';
      }).join('');
    if(isToday){
      body += '<button class="sheet-btn" id="go-today">Aller à la séance</button>';
    } else if(log && log.notes){
      body += '<div style="margin-top:14px; font-size:12.5px; color:var(--text-dim);"><span style="color:var(--text-muted);">Notes : </span>' + log.notes + '</div>';
    }
  }

  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = '<div class="sheet"><div class="handle"></div>' + body + '</div>';
  modal.onclick = function(ev){ if(ev.target===modal) modal.remove(); };
  root.appendChild(modal);
  const goBtn = modal.querySelector('#go-today');
  if(goBtn) goBtn.onclick = function(){ modal.remove(); state.tab = 'today'; render(); };
}

function renderCalendar(){
  if(!state.calMonth) state.calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  const area = root.querySelector('.scroll-area');
  const monthStart = state.calMonth;
  const year = monthStart.getFullYear(), month = monthStart.getMonth();
  const firstDow = (monthStart.getDay()+6)%7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = monthStart.toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
  const todayStr = todayKey();

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += '<div class="cal-day blank"></div>';
  for(let day=1; day<=daysInMonth; day++){
    const dateObj = new Date(year, month, day);
    const dateStr = todayKey(dateObj);
    const dayType = DAY_MAP[dateObj.getDay()];
    const isToday = dateStr === todayStr;
    const log = state.logs[dateStr];
    const done = log && log.completed;
    cells += '<div class="cal-day ' + (isToday?'today':'') + '" data-day="' + dateStr + '">' +
      '<span>' + day + '</span>' +
      (dayType!=='rest' ? '<div class="dot ' + dayType + '"></div>' : '') +
      (done ? '<span class="check">&#10003;</span>' : '') +
      '</div>';
  }

  area.innerHTML =
    '<div class="cal-nav"><button id="cal-prev">&#8592;</button>' +
    '<div class="serif" style="font-size:20px; font-weight:600; text-transform:capitalize;">' + monthLabel + '</div>' +
    '<button id="cal-next">&#8594;</button></div>' +
    '<div class="cal-grid">' +
    ['L','M','M','J','V','S','D'].map(function(d){ return '<div class="cal-dow">' + d + '</div>'; }).join('') +
    cells +
    '</div>' +
    '<div class="cal-legend">' +
    '<span><div class="dot push"></div>Push</span>' +
    '<span><div class="dot pull"></div>Pull</span>' +
    '<span><div class="dot legs"></div>Jambes</span>' +
    '<span><div class="dot upper"></div>Upper focus</span>' +
    '<span>&#10003; séance terminée</span>' +
    '</div>';
  area.querySelector('#cal-prev').onclick = function(){ state.calMonth = new Date(year, month-1, 1); renderCalendar(); };
  area.querySelector('#cal-next').onclick = function(){ state.calMonth = new Date(year, month+1, 1); renderCalendar(); };
  area.querySelectorAll('[data-day]').forEach(function(el){
    el.onclick = function(){ openDaySheet(el.dataset.day); };
  });
}

function render(){
  const today = new Date();
  root.innerHTML =
    '<div class="top-header"><div><div class="date">' + fmtDate(today) + '</div><div class="serif title">CORPUS<span class="mark"></span></div></div></div>' +
    '<div class="scroll-area"></div>' +
    '<div class="tabbar">' +
    '<button data-tab="today" class="' + (state.tab==='today'?'active':'') + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.5" fill="currentColor"/></svg>Aujourd\'hui</button>' +
    '<button data-tab="calendar" class="' + (state.tab==='calendar'?'active':'') + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>Calendrier</button>' +
    '<button data-tab="history" class="' + (state.tab==='history'?'active':'') + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="4" y1="20" x2="4" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="20" y1="20" x2="20" y2="14"/></svg>Historique</button>' +
    '<button data-tab="photos" class="' + (state.tab==='photos'?'active':'') + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-4-4 3-3-2-4 3"/></svg>Photos</button>' +
    '</div>';
  root.querySelectorAll('[data-tab]').forEach(function(b){
    b.onclick = function(){ state.tab = b.dataset.tab; render(); };
  });
  if(state.tab==='today') renderToday();
  else if(state.tab==='calendar') renderCalendar();
  else if(state.tab==='history') renderHistory();
  else renderPhotos();
}

init();
})();
</script>

</body>
